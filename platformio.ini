; PlatformIO project configuration for USBKeylogger
; Matches the Arduino IDE settings from the project README:
;   Board: Generic ESP8266 Module
;   CPU Frequency: 80 MHz
;   Flash Size: 4MB (FS:3MB OTA:~512KB)
;   Flash Mode: DOUT
;   lwIP Variant: v2 Lower Memory
;
; Install PlatformIO (https://platformio.org/install), then run:
;   pio run
;   pio run --target upload

[platformio]
src_dir = USBKeylogger.ino/USBKeylogger

[env:esp12e]
platform = espressif8266@^4.2.1
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m3m.ld
board_build.f_cpu = 80000000L
board_build.flash_mode = dout
monitor_speed = 115200
upload_speed = 921600

; Required 3rd-party libraries (auto-downloaded on first build)
lib_deps =
    me-no-dev/ESPAsyncTCP @ ^1.2.2
    https://github.com/me-no-dev/ESPAsyncUDP.git
    me-no-dev/ESPAsyncWebServer @ ^1.2.3
    devyte/ESPAsyncDNSServer @ ^1.0.0

; Build flags matching the README recommended Arduino IDE options
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

; OTA upload target (optional). Set upload_port to the device IP or mDNS name.
[env:esp12e-ota]
extends = env:esp12e
upload_protocol = espota
upload_port = USBKeylogger.local
upload_flags =
    --auth=usbkeylogger_ota
