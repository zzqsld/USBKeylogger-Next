; PlatformIO project configuration for USBKeylogger
; This resolves the missing ESP8266WiFi / ESPAsync* headers automatically.
; Install PlatformIO (https://platformio.org/install), then run:
;   pio run
;   pio run --target upload

[platformio]
src_dir = USBKeylogger.ino/USBKeylogger

[env:esp12e]
platform = espressif8266@^4.2.1
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
monitor_speed = 115200
upload_speed = 921600

; Required 3rd-party libraries (auto-downloaded on first build)
lib_deps =
    me-no-dev/ESPAsyncTCP @ ^1.2.2
    https://github.com/me-no-dev/ESPAsyncUDP.git
    me-no-dev/ESPAsyncWebServer @ ^1.2.3
    devyte/ESPAsyncDNSServer @ ^1.0.0
    plerup/EspSoftwareSerial @ ^8.2.0

; Build flags for dual-CH9350L and OTA support
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
    -D SECOND_UART_RX=D5
    -D SECOND_UART_TX=D6

; OTA upload target (optional). Set upload_port to the device IP or mDNS name.
[env:esp12e-ota]
extends = env:esp12e
upload_protocol = espota
upload_port = USBKeylogger.local
upload_flags =
    --auth=usbkeylogger_ota
